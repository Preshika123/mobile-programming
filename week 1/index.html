<!DOCTYPE html>
<html>
<head>
<style>

body {
    font-family: 'Times New Roman', Times, serif;
    background-color: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* ID Selector */
#profile-card {
    background-color: lightblue;
    width: 320px;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    transition: 0.3s;
}

/* Card Hover Effect */
#profile-card:hover {
    transform: translateY(-8px);
}

/* Class Selectors */
.student-image {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #007bff;
    object-fit: cover;
    margin-bottom: 15px;
}

.student-name {
    color: #333;
    margin: 10px 0;
    font-size: 24px;
}

.student-course {
    color: #666;
    font-size: 16px;
    margin-bottom: 15px;
}

.profile-btn {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

.profile-btn:hover {
    background-color: #0056b3;
    transform: scale(1.05);
}

</style>
</head>

<body>

<div id="profile-card">

    <img src="/week 1/images/preshika.jpg.jpg" alt="Student Photo" class="student-image">

    <h2 class="student-name">Preshika Thapa</h2>

    <p class="student-course">
        Bachelor of Science in Information Technology Student
    </p>

    <button class="profile-btn">View Profile</button>

</div>

</body>
</html>
